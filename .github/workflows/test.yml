name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # wanderers-core's reusable checks: the vendored core matches its pin (and the published release; the checker comes from core
  # at the pinned tag), then `npm ci` with the committed package-lock.json (eslint 10.13.0 only), syntax check, ESLint and the
  # unit tests. Loot Ledger has no JSDoc type check (tsc) yet, so `types` is off. Keep the ref equal to the lock's version
  # (tests/house.test.mjs checks it).
  checks:
    uses: cocoomg11/wanderers-core/.github/workflows/module-checks.yml@v0.6.0
    with:
      types: false

  manifest:
    name: module.json is valid and points at its own version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          V=$(jq -r .version module.json)
          jq -e --arg v "$V" '.download | endswith("/v\($v)/module.zip")' module.json
