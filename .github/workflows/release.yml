name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the release tag format
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' must look like vMAJOR.MINOR.PATCH (for example v0.3.0)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set version and URLs in module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg r "$REPO" --arg tag "$GITHUB_REF_NAME" '
            .version = $v
            | .url = "https://github.com/\($r)"
            | .manifest = "https://github.com/\($r)/releases/latest/download/module.json"
            | .download = "https://github.com/\($r)/releases/download/\($tag)/module.zip"
            | .bugs = "https://github.com/\($r)/issues"
          ' module.json > module.tmp && mv module.tmp module.json

      - name: Build module.zip
        run: zip -r module.zip module.json scripts styles lang README.md LICENSE

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
